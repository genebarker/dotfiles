# switch prefix key to [ctrl][-]
unbind C-b
set -g prefix C-_

# status bar
set -g status-position top

# red SSH pill when this tmux server runs on a remote host
set -g @ssh ""
if-shell 'test -n "$SSH_CONNECTION"' \
  'set -g @ssh "#[fg=colour255,bg=colour124,bold] SSH #h #[default] "'

# right side: quiet date, clock pill to bookend the session pill
set -g status-right "#{E:@ssh}#[fg=colour153]%a %d-%b \
#[fg=colour24,bg=colour153,bold] %H:%M "

# use tmux-256color where this host has its terminfo, else xterm-256color
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "xterm-256color"'

# advertise that truecolor is enabled
set -ga terminal-overrides ',*:Tc'

# improve navbar colors
set -g status-style fg=colour153,bg=colour24
set -g message-style fg=colour255,bg=colour124
set -g pane-border-style fg=colour24
set -g pane-active-border-style fg=colour38

# session name as a quiet pill on the left
set -g status-left "#[fg=colour24,bg=colour153,bold] #S #[default] "
set -g status-left-length 20

# window tabs: padded, current one lit up in the border accent,
# Z marks a zoomed window
setw -g window-status-format " #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format \
  " #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-style fg=colour255,bg=colour38,bold
setw -g window-status-separator ""

# activity: an underline nudge, not a reverse-video shout
setw -g window-status-activity-style fg=colour255,underscore

# round the LazyGit popup to match
set -g popup-border-lines rounded
set -g popup-border-style fg=colour38

# keep a healthy history
set -g history-limit 10000

# act like vim
setw -g mode-keys vi

# tell vim when its pane gains focus (drives autoread reloads)
set -g focus-events on

bind -T copy-mode-vi "v" send -X begin-selection
bind -T copy-mode-vi "y" send -X copy-selection-and-cancel

# resize panes using vim direction keys
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r H resize-pane -L 2
bind -r L resize-pane -R 2

# toggle zoom to next pane
bind y if-shell "[ #{window_zoomed_flag} -eq 1 ]" \
    "select-pane -t :.+ \; resize-pane -Z"

# smart pane switching using vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# enable mouse control
set -g mouse on

# don't rename windows automatically
set -g allow-rename off

# start windows & pane numbers at 1
# (align with keyboard order)
set -g base-index 1
setw -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# shift current window left / right in the tab order
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# highlight window when has new activity
set -g visual-activity on
setw -g monitor-activity on

# display messages & pane numbers longer
set -g display-time 2000
set -g display-panes-time 2000

# LazyGit popup
bind g display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "lazygit"

# reload config file
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
